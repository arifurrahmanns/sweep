name: Release

# Runs when a version tag like v0.2.0 is pushed (see "Release" in the README).
# "Run workflow" on the Actions tab builds and signs without publishing, to
# check signing works; the .dmg is attached to that run instead.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: Check tag matches version
        if: github.ref_type == 'tag'
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match package.json version $version"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # The same certificate signs every release, so macOS keeps Sweep's
      # Full Disk Access after updates. See scripts/create-signing-cert.sh.
      - name: Import signing certificate
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$MACOS_CERTIFICATE" ] || [ -z "$MACOS_CERTIFICATE_PASSWORD" ]; then
            echo "::error::Add the MACOS_CERTIFICATE and MACOS_CERTIFICATE_PASSWORD secrets (see scripts/create-signing-cert.sh)"
            exit 1
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password=$(openssl rand -hex 24)
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/signing.p12" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/signing.p12"
          security find-identity -p codesigning "$keychain"

      # One app that runs on both Apple silicon and Intel Macs.
      - name: Build
        env:
          APPLE_SIGNING_IDENTITY: Sweep Release Signing
        run: npm run build -- --target universal-apple-darwin

      - name: Check signature
        run: |
          app=src-tauri/target/universal-apple-darwin/release/bundle/macos/Sweep.app
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign --display --requirements - "$app" 2>&1 | tee "$RUNNER_TEMP/requirement.txt"
          if ! grep -qE 'certificate (root|leaf) = H"' "$RUNNER_TEMP/requirement.txt"; then
            echo "::error::Sweep.app isn't signed with the release certificate"
            exit 1
          fi

      - name: Attach build to this run
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: Sweep-dmg
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          retention-days: 7

      - name: Publish release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          files: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            Download the `.dmg`, open it and drag Sweep to Applications.

            Sweep is signed with its own certificate, not an Apple Developer ID. The first time you open it, go to System Settings → Privacy & Security and click **Open Anyway**.
