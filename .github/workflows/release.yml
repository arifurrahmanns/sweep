name: Release

# Runs when a version tag like v0.2.0 is pushed (see "Release" in the README).
# "Run workflow" on the Actions tab builds both apps without publishing; the
# installers are attached to that run instead.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      matrix:
        include:
          # One app that runs on both Apple silicon and Intel Macs.
          - name: macOS
            os: macos-latest
            targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin
            installer: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - name: Windows
            os: windows-latest
            targets: x86_64-pc-windows-msvc
            args: ''
            installer: src-tauri/target/release/bundle/nsis/*.exe
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: Check tag matches version
        if: github.ref_type == 'tag'
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match package.json version $version"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # The same certificate signs every macOS release, so macOS keeps
      # Sweep's Full Disk Access after updates. See scripts/create-signing-cert.sh.
      # Without the secrets the app is built unsigned, as before.
      - name: Import signing certificate
        id: signing
        if: runner.os == 'macOS'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$MACOS_CERTIFICATE" ] || [ -z "$MACOS_CERTIFICATE_PASSWORD" ]; then
            echo "::warning::Building unsigned: add the MACOS_CERTIFICATE and MACOS_CERTIFICATE_PASSWORD secrets to sign (see scripts/create-signing-cert.sh)"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password=$(openssl rand -hex 24)
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/signing.p12" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/signing.p12"
          security find-identity -p codesigning "$keychain"
          echo "APPLE_SIGNING_IDENTITY=Sweep Release Signing" >> "$GITHUB_ENV"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build
        run: npm run build -- ${{ matrix.args }}

      - name: Check signature
        if: runner.os == 'macOS' && steps.signing.outputs.signed == 'true'
        run: |
          app=src-tauri/target/universal-apple-darwin/release/bundle/macos/Sweep.app
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign --display --requirements - "$app" 2>&1 | tee "$RUNNER_TEMP/requirement.txt"
          if ! grep -qE 'certificate (root|leaf) = H"' "$RUNNER_TEMP/requirement.txt"; then
            echo "::error::Sweep.app isn't signed with the release certificate"
            exit 1
          fi

      - name: Keep installer
        uses: actions/upload-artifact@v7
        with:
          name: Sweep-${{ matrix.name }}
          path: ${{ matrix.installer }}
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: installers
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          files: installers/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            **macOS:** download the `.dmg`, open it and drag Sweep to Applications. Sweep isn't signed with an Apple Developer ID, so the first time you open it, go to System Settings → Privacy & Security and click **Open Anyway**.

            **Windows:** download the `-setup.exe` and run it. If Windows says it protected your PC, click **More info**, then **Run anyway**.
