[package]
name = "sweep"
version = "0.1.1"
description = "Find and clean up files your Mac doesn't need"
license = "MIT"
repository = "https://github.com/arifurrahmanns/sweep"
edition = "2021"
rust-version = "1.83"

[lib]
name = "sweep_lib"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
