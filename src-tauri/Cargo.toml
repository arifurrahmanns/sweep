[package]
name = "sweep"
version = "0.1.4"
description = "Find and clean up files your computer doesn't need"
license = "MIT"
repository = "https://github.com/arifurrahmanns/sweep"
edition = "2021"
rust-version = "1.83"

[lib]
name = "sweep_lib"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
