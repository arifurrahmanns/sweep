<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sweep</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Before the first scan: just the disk and a Scan button. -->
  <section id="start" class="start">
    <header class="toolbar plain" data-tauri-drag-region>
      <div class="tools">
        <button class="tool" data-settings type="button" title="Settings (⌘,)" aria-label="Settings"></button>
      </div>
    </header>
    <div class="start-body" data-tauri-drag-region>
      <div class="gauge" id="gauge">
        <svg viewBox="0 0 200 200" aria-hidden="true">
          <defs>
            <linearGradient id="gaugeFill" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#38d0c4"/>
              <stop offset="1" stop-color="#1563dd"/>
            </linearGradient>
          </defs>
          <circle class="gauge-track" cx="100" cy="100" r="86"/>
          <circle class="gauge-used" id="gaugeUsed" cx="100" cy="100" r="86"/>
        </svg>
        <div class="gauge-label">
          <strong id="gaugeFree"></strong>
          <span id="gaugeOf"></span>
        </div>
      </div>
      <p class="scan-step" id="scanStep" hidden></p>
      <button class="btn primary large" id="startScan" type="button">Scan</button>
      <div id="accessNote" class="access-note" hidden>
        <span>Full Disk Access is off</span>
        <button class="btn small" data-fda type="button">Turn On…</button>
      </div>
    </div>
  </section>

  <!-- After a scan: sidebar of categories, list on the right. -->
  <div id="app" class="app" hidden>
    <aside class="sidebar">
      <div class="sidebar-top" data-tauri-drag-region></div>
      <nav id="catList" aria-label="Categories"></nav>
      <div class="sidebar-foot">
        <div id="skipped"></div>
        <div class="storage" title="Startup disk">
          <div class="disk-bar"><div class="disk-used" id="diskUsed"></div><div class="disk-selected" id="diskSelected"></div></div>
          <div class="disk-label" id="diskLabel"></div>
        </div>
      </div>
    </aside>

    <section class="content">
      <header class="toolbar" id="toolbar" data-tauri-drag-region>
        <h1 id="catTitle" data-tauri-drag-region></h1>
        <div class="tools">
          <button class="tool" id="rescanBtn" type="button" title="Scan Again (⌘R)" aria-label="Scan again"></button>
          <button class="tool" data-settings type="button" title="Settings (⌘,)" aria-label="Settings"></button>
        </div>
      </header>
      <div id="catView" class="scroll"></div>
      <footer class="actionbar" id="actionbar">
        <div id="selSummary"></div>
        <button class="btn primary" id="cleanBtn" type="button" disabled>Clean Up</button>
      </footer>
    </section>
  </div>

  <div id="modal" class="modal-backdrop" hidden>
    <div class="modal" role="dialog" aria-modal="true" id="modalBox"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
