<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sweep</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="titlebar" data-tauri-drag-region>
    <div class="brand" data-tauri-drag-region>
      <svg class="logo" viewBox="100 100 824 824" aria-hidden="true">
        <defs>
          <linearGradient id="logoBg" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#38d0c4"/>
            <stop offset="1" stop-color="#1563dd"/>
          </linearGradient>
        </defs>
        <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#logoBg)"/>
        <circle cx="512" cy="512" r="250" fill="none" stroke="#fff" stroke-opacity="0.28" stroke-width="64"/>
        <circle cx="512" cy="512" r="250" fill="none" stroke="#fff" stroke-width="64" stroke-linecap="round" stroke-dasharray="1060 1571" transform="rotate(-90 512 512)"/>
        <path d="M512 392 L543 481 L632 512 L543 543 L512 632 L481 543 L392 512 L481 481 Z" fill="#fff"/>
      </svg>
      <span data-tauri-drag-region>Sweep</span>
    </div>
    <div class="disk" data-tauri-drag-region>
      <div class="disk-bar" data-tauri-drag-region><div class="disk-used" id="diskUsed"></div><div class="disk-selected" id="diskSelected"></div></div>
      <div class="disk-label" id="diskLabel" data-tauri-drag-region></div>
    </div>
    <div class="actions">
      <button class="ghost" id="foldersBtn" type="button">Folders</button>
      <button class="primary" id="scanBtn" type="button">Scan</button>
    </div>
  </header>

  <main id="main">
    <section id="welcome" class="center">
      <div class="hero">
        <h1>Free up space</h1>
        <p>Nothing is deleted until you confirm.</p>
        <button class="primary large" id="welcomeScan" type="button">Scan</button>
      </div>
    </section>

    <section id="scanning" class="center" hidden>
      <div class="hero">
        <div class="spinner" aria-hidden="true"></div>
        <p id="scanStep">Scanning</p>
      </div>
    </section>

    <section id="results" hidden>
      <nav id="catList" aria-label="Categories"></nav>
      <div id="catView"></div>
    </section>
  </main>

  <footer id="footer" hidden>
    <div id="selSummary"></div>
    <button class="primary" id="cleanBtn" type="button" disabled>Clean up</button>
  </footer>

  <div id="modal" class="modal-backdrop" hidden>
    <div class="modal" role="dialog" aria-modal="true" id="modalBox"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
